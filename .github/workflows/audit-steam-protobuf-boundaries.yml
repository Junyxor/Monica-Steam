name: Audit Steam Protobuf Boundaries

on:
  push:
    branches:
      - refactor/rust-core-dock-performance
    paths:
      - .github/workflows/audit-steam-protobuf-boundaries.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/rust-core-dock-performance
          fetch-depth: 0

      - name: Inventory remaining Kotlin protobuf boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('app/src/main/java/takagi/ru/monica/steam')
          rows = []
          for path in root.rglob('*.kt'):
              text = path.read_text(encoding='utf-8')
              readers = text.count('SteamProtoReader(')
              writers = text.count('SteamProtoWriter()')
              if readers or writers:
                  rows.append((readers + writers, readers, writers, text.count('\n') + 1, str(path)))
          rows.sort(reverse=True)
          print('TOTAL_FILES', len(rows))
          print('TOTAL_READERS', sum(row[1] for row in rows))
          print('TOTAL_WRITERS', sum(row[2] for row in rows))
          print('score readers writers lines path')
          for score, readers, writers, lines, path in rows:
              print(f'{score:5d} {readers:7d} {writers:7d} {lines:5d} {path}')
          PY

      - name: Remove one-time audit workflow
        run: rm .github/workflows/audit-steam-protobuf-boundaries.yml

      - name: Commit audit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove protobuf boundary audit workflow"
          git push origin HEAD:refactor/rust-core-dock-performance
